<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A"/>
      <stop offset="100%" style="stop-color:#1E293B"/>
    </linearGradient>
    <linearGradient id="path" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366F1"/>
      <stop offset="100%" style="stop-color:#818CF8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="150" rx="15" fill="url(#bg)"/>
  
  <!-- Grid pattern -->
  <g opacity="0.2">
    <rect x="20" y="30" width="20" height="20" fill="#334155" stroke="#475569"/>
    <rect x="40" y="30" width="20" height="20" fill="#334155" stroke="#475569"/>
    <rect x="60" y="30" width="20" height="20" fill="#334155" stroke="#475569"/>
    <rect x="80" y="30" width="20" height="20" fill="#334155" stroke="#475569"/>
    <rect x="100" y="30" width="20" height="20" fill="#334155" stroke="#475569"/>
    <rect x="120" y="30" width="20" height="20" fill="#334155" stroke="#475569"/>
    <rect x="140" y="30" width="20" height="20" fill="#334155" stroke="#475569"/>
    <rect x="160" y="30" width="20" height="20" fill="#334155" stroke="#475569"/>
  </g>
  
  <!-- Path -->
  <path d="M10 75 L50 75 L50 45 L150 45 L150 105 L100 105 L100 125 L170 125" 
        stroke="url(#path)" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Enemies -->
  <g transform="translate(40, 75)">
    <polygon points="8,0 -4,-6 -4,6" fill="#EF4444"/>
  </g>
  <g transform="translate(55, 75)">
    <polygon points="8,0 -4,-6 -4,6" fill="#EF4444"/>
  </g>
  <g transform="translate(70, 45)">
    <polygon points="8,0 -4,-6 -4,6" fill="#FACC15"/>
  </g>
  
  <!-- Towers -->
  <g transform="translate(90, 75)">
    <polygon points="12,0 -6,-8 -6,8" fill="#22C55E" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="5" fill="#1E293B"/>
  </g>
  <g transform="translate(120, 45)">
    <polygon points="12,0 -6,-8 -6,8" fill="#F97316" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="5" fill="#1E293B"/>
  </g>
  <g transform="translate(130, 105)">
    <polygon points="12,0 -6,-8 -6,8" fill="#38BDF8" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="5" fill="#1E293B"/>
  </g>
  
  <!-- Start/End markers -->
  <circle cx="10" cy="75" r="6" fill="#10B981"/>
  <circle cx="170" cy="125" r="6" fill="#EF4444"/>
  
  <!-- Projectile -->
  <circle cx="100" cy="45" r="3" fill="#22C55E" filter="url(#glow)"/>
  
  <!-- UI Elements -->
  <rect x="10" y="10" width="45" height="18" rx="4" fill="rgba(30,41,59,0.8)"/>
  <text x="32" y="23" text-anchor="middle" fill="#FBBF24" font-size="10" font-family="Arial" font-weight="bold">💰 150</text>
  
  <rect x="60" y="10" width="40" height="18" rx="4" fill="rgba(30,41,59,0.8)"/>
  <text x="80" y="23" text-anchor="middle" fill="#F8FAFC" font-size="10" font-family="Arial" font-weight="bold">Wave 5</text>
  
  <rect x="105" y="10" width="30" height="18" rx="4" fill="rgba(30,41,59,0.8)"/>
  <text x="120" y="23" text-anchor="middle" fill="#EF4444" font-size="10" font-family="Arial" font-weight="bold">❤️ 15</text>
  
  <!-- Title -->
  <text x="100" y="145" text-anchor="middle" fill="#6366F1" font-size="10" font-family="Arial" font-weight="bold">TOWER DEFENSE PRO</text>
</svg>