<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#EFF6FF"/>
      <stop offset="100%" style="stop-color:#DBEAFE"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="150" rx="15" fill="url(#bg)"/>
  
  <!-- Maze Grid -->
  <g transform="translate(25, 25)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="20" height="20" fill="#374151" rx="2"/>
    <rect x="22" y="0" width="20" height="20" fill="#374151" rx="2"/>
    <rect x="44" y="0" width="20" height="20" fill="#374151" rx="2"/>
    <rect x="66" y="0" width="20" height="20" fill="#374151" rx="2"/>
    <rect x="88" y="0" width="20" height="20" fill="#374151" rx="2"/>
    
    <!-- Row 2 -->
    <rect x="0" y="22" width="20" height="20" fill="#374151" rx="2"/>
    <rect x="22" y="22" width="20" height="20" fill="#DBEAFE" rx="2"/>
    <rect x="44" y="22" width="20" height="20" fill="#DBEAFE" rx="2"/>
    <rect x="66" y="22" width="20" height="20" fill="#DBEAFE" rx="2"/>
    <rect x="88" y="22" width="20" height="20" fill="#374151" rx="2"/>
    
    <!-- Row 3 -->
    <rect x="0" y="44" width="20" height="20" fill="#374151" rx="2"/>
    <rect x="22" y="44" width="20" height="20" fill="#DBEAFE" rx="2"/>
    <rect x="44" y="44" width="20" height="20" fill="#374151" rx="2"/>
    <rect x="66" y="44" width="20" height="20" fill="#DBEAFE" rx="2"/>
    <rect x="88" y="44" width="20" height="20" fill="#374151" rx="2"/>
    
    <!-- Row 4 -->
    <rect x="0" y="66" width="20" height="20" fill="#374151" rx="2"/>
    <rect x="22" y="66" width="20" height="20" fill="#DBEAFE" rx="2"/>
    <rect x="44" y="66" width="20" height="20" fill="#DBEAFE" rx="2"/>
    <rect x="66" y="66" width="20" height="20" fill="#DBEAFE" rx="2"/>
    <rect x="88" y="66" width="20" height="20" fill="#374151" rx="2"/>
    
    <!-- Row 5 -->
    <rect x="0" y="88" width="20" height="20" fill="#374151" rx="2"/>
    <rect x="22" y="88" width="20" height="20" fill="#374151" rx="2"/>
    <rect x="44" y="88" width="20" height="20" fill="#374151" rx="2"/>
    <rect x="66" y="88" width="20" height="20" fill="#374151" rx="2"/>
    <rect x="88" y="88" width="20" height="20" fill="#374151" rx="2"/>
  </g>
  
  <!-- Robot -->
  <g transform="translate(47, 47)">
    <circle cx="10" cy="10" r="10" fill="#3B82F6"/>
    <circle cx="6" cy="8" r="2" fill="white"/>
    <circle cx="14" cy="8" r="2" fill="white"/>
    <path d="M6 14 Q10 17 14 14" stroke="white" stroke-width="2" fill="none"/>
  </g>
  
  <!-- Flag (Goal) -->
  <g transform="translate(93, 91)">
    <rect x="4" y="2" width="2" height="16" fill="#6B7280"/>
    <polygon points="6,2 18,6 6,10" fill="#EF4444"/>
  </g>
  
  <!-- Command Blocks -->
  <g transform="translate(140, 30)">
    <rect x="0" y="0" width="45" height="20" rx="5" fill="#3B82F6"/>
    <text x="22" y="14" text-anchor="middle" fill="white" font-size="10" font-family="sans-serif">⬆️ Maju</text>
    
    <rect x="0" y="28" width="45" height="20" rx="5" fill="#3B82F6"/>
    <text x="22" y="42" text-anchor="middle" fill="white" font-size="10" font-family="sans-serif">⬅️ Kiri</text>
    
    <rect x="0" y="56" width="45" height="20" rx="5" fill="#3B82F6"/>
    <text x="22" y="70" text-anchor="middle" fill="white" font-size="10" font-family="sans-serif">➡️ Kanan</text>
  </g>
  
  <!-- Title -->
  <text x="100" y="140" text-anchor="middle" fill="#3B82F6" font-size="12" font-family="Fredoka One, cursive" font-weight="bold">Robot Builder</text>
</svg>