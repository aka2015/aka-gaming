<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#E8F5E9"/>
      <stop offset="100%" style="stop-color:#C8E6C9"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="300" height="200" fill="url(#bg)"/>
  
  <circle cx="240" cy="40" r="25" fill="#FFD700" filter="url(#glow)"/>
  <text x="240" y="48" text-anchor="middle" font-size="24">$</text>
  
  <rect x="40" y="60" width="220" height="90" rx="10" fill="#fff" stroke="#4CAF50" stroke-width="3"/>
  
  <text x="55" y="90" font-family="sans-serif" font-size="18">🍞 Roti</text>
  <text x="200" y="90" font-family="sans-serif" font-size="18" fill="#666">Rp 3.000</text>
  
  <text x="55" y="115" font-family="sans-serif" font-size="18">🥛 Susu</text>
  <text x="200" y="115" font-family="sans-serif" font-size="18" fill="#666">Rp 5.000</text>
  
  <line x1="40" y1="125" x2="260" y2="125" stroke="#4CAF50" stroke-width="2"/>
  
  <text x="55" y="148" font-family="sans-serif" font-size="18" font-weight="bold">Total</text>
  <text x="185" y="148" font-family="sans-serif" font-size="18" font-weight="bold">Rp 8.000</text>
  
  <text x="50" y="180" font-family="sans-serif" font-size="14" fill="#FF9800">💵 Dibayar: Rp 10.000</text>
  
  <text x="230" y="180" font-family="sans-serif" font-size="14" fill="#4CAF50">Kembalian:</text>
  
  <text x="220" y="195" font-family="sans-serif" font-size="16" font-weight="bold" fill="#388E3C">Rp 2.000</text>
</svg>