<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Bubble Pop ABC</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <section id="start-screen" class="screen active">
      <div class="start-content">
        <div class="start-icon">🫧</div>
        <h1>Bubble Pop ABC</h1>
        <p class="subtitle">Belajar Membaca untuk Anak</p>
        <div class="how-to-play">
          <div class="step">
            <span class="step-icon">👀</span>
            <span>Lihat gambar & kata</span>
          </div>
          <div class="step">
            <span class="step-icon">🫧</span>
            <span>Pecahkan balon huruf</span>
          </div>
          <div class="step">
            <span class="step-icon">✅</span>
            <span>Susun jadi kata benar</span>
          </div>
        </div>
        <button id="start-btn" class="btn-primary">Mulai Belajar 🎮</button>
      </div>
    </section>

    <section id="game-screen" class="screen">
      <header class="hud">
        <div class="hud-item">
          <span class="hud-label">Skor</span>
          <span class="hud-value" id="score">0</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">Soal</span>
          <span class="hud-value" id="level">1/10</span>
        </div>
        <div class="hud-item">
          <span class="hud-label">⭐</span>
          <span class="hud-value" id="stars">0</span>
        </div>
      </header>

      <div class="hint-area">
        <div id="word-hint" class="word-hint">🐱</div>
        <div id="word-display" class="word-display">
          <span class="word-label">Susun huruf:</span>
          <div id="slots" class="slots"></div>
        </div>
      </div>

      <div id="bubble-area" class="bubble-area"></div>
    </section>

    <section id="result-screen" class="screen">
      <div class="result-content">
        <div class="result-icon">🎉</div>
        <h2>Selamat!</h2>
        <p class="result-sub">Kamu hebat sekali!</p>
        <div class="result-stats">
          <div class="stat">
            <span class="stat-label">Skor</span>
            <span class="stat-value" id="final-score">0</span>
          </div>
          <div class="stat">
            <span class="stat-label">⭐ Bintang</span>
            <span class="stat-value" id="final-stars">0</span>
          </div>
          <div class="stat">
            <span class="stat-label">Benar</span>
            <span class="stat-value" id="final-correct">0/10</span>
          </div>
        </div>
        <button id="replay-btn" class="btn-primary">Main Lagi 🔄</button>
      </div>
    </section>
  </div>

  <script src="../shared/score-reporter.js"></script>
  <script src="script.js"></script>
</body>
</html>
